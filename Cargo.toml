[workspace]
resolver = "2"
members = [
    "crates/rarkzip-engine",
    "crates/rarkzip-crypt",
    "crates/rarkzip-cli",
    "crates/rarkzip-gui",
    "crates/rarkzip-shell",
]

# UnRAR passes unaligned wchar_t pointers to the volume callback; the local
# patch replaces the slice construction with unaligned reads.
[patch.crates-io]
unrar-ng = { path = "vendor/unrar-ng" }

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["RarkZip Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
