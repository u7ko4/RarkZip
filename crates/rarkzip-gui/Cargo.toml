[package]
name = "rarkzip-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RarkZip 图形界面（GPUI）"

[[bin]]
name = "rarkzip"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
gpui-kit = "0.9.0"
image = "0.25.9"
rarkzip-cli = { path = "../rarkzip-cli" }
rarkzip-crypt = { path = "../rarkzip-crypt" }
rarkzip-engine = { path = "../rarkzip-engine" }
rarkzip-shell = { version = "0.1.0", path = "../rarkzip-shell" }
open = "5.4.5"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0.154"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# 只启用 GPUI 核心测试窗口能力，避免 gpui-kit/test-support 引入 gpui-fast。
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3.27.0"
