[package]
name = "rarkzip-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RarkZip 归档引擎：内容识别、归档读写、智能解压、密码与安全管理"

[lib]
name = "rarkzip_engine"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
bzip2 = "0.6.1"
chrono = "0.4.45"
crc32fast = "1.5.4"
encoding_rs = "0.8.35"
filetime = "0.2.29"
flate2 = "1.1.10"
globset = "0.4.19"
libdeflater = "1.22"
libmkiso = "0.1.5"
lzma-rust2 = { version = "0.16", features = ["std", "encoder"] }
md-5 = "0.10"
oxiarc-archive = "0.4.2"
pgp = { version = "0.17.0", default-features = false }
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.20.2", features = ["deflate", "zstd", "brotli"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
trash = "5.2.9"
unrar-ng = "0.7.7"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Antimalware"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
xz2 = "0.1.7"
zip = "7.3.0"
zpaq_rs = "1.0.4"
zstd = "0.14.3"

[dev-dependencies]

