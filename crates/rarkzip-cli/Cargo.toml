[package]
name = "rarkzip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RarkZip 无头命令行工具 bx"

[lib]
name = "rarkzip_cli"
path = "src/lib.rs"

[[bin]]
name = "bx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rarkzip-engine = { path = "../rarkzip-engine" }
rarkzip-shell = { version = "0.1.0", path = "../rarkzip-shell" }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
