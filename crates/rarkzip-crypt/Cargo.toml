[package]
name = "rarkzip-crypt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "File and text encryption with legacy compatibility for RarkZip"

[lib]
name = "rarkzip_crypt"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
argon2 = "0.5"
blake2 = "0.10"
blake3 = "1.8"
blowfish = "0.10"
cipher = "0.5"
chrono = "0.4"
constant_time_eq = "0.3"
crc32fast = "1.5"
dct-io = "0.1.1"
filetime = "0.2"
flate2 = "1.1"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
lzma-rust2 = { version = "0.16", features = ["std", "encoder"] }
num-bigint = "0.4"
rc6 = "0.1"
scrypt = "0.11"
serpent = "0.6"
sha3 = "0.10"
skein = "0.2"
tempfile = "3.27"
thiserror = "2"
time = "0.3"
threefish = "0.6"
twofish = "0.8"
walkdir = "2.5"
zeroize = "1.8"
zip = { version = "7.3", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
hex = "0.4"
