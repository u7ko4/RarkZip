[package]
name = "nimzip-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NimZip 图形界面（GPUI）"

[[bin]]
name = "nimzip"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
gpui-kit = "0.9.0"
image = "0.25.9"
nimzip-cli = { path = "../nimzip-cli" }
nimzip-engine = { path = "../nimzip-engine" }
nimzip-shell = { version = "0.1.0", path = "../nimzip-shell" }
open = "5.4.5"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0.154"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
